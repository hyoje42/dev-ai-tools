# Enable mouse support
set -g mouse on

# Use vi-style keys in copy mode
set -g mode-keys vi

# Copy-mode selection -> system clipboard (X11)
# Requires the xclip package:  sudo apt install xclip
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
# Mouse drag-release also copies to the system clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
